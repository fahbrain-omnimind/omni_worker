[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-agent-coworker"
version = "0.10.0"
description = "Omni-Gemma Lab-Agent Coworker — sovereign agentic coworker for Google Competitions (The Gemma 4 Developer Agent Paper Track & Competition)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabrício da Silva" }]
keywords = [
    "gemma-4",
    "agentic-software-engineering",
    "executive-function",
    "metacognitive-governance",
    "spectral-activations",
    "markov-blanket",
    "kaggle-competition",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/fabriciodasilva/omni_worker"
Mirror = "https://gitlab.com/omni-group535144/omni_worker"
Documentation = "https://fabriciodasilva.github.io/omni_worker/"
Writeup = "https://github.com/fabriciodasilva/omni_worker/blob/master/docs/PAPER_WRITEUP.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
    "psutil>=5.9",
    "numpy>=1.26",
    "sse-starlette>=2.0",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
acp = ["agent-client-protocol>=0.12,<1"]
kernel = ["faiss-cpu>=1.8", "sentence-transformers>=3.0", "pandas>=2.0", "pyarrow>=14", "nvidia-ml-py>=12"]
brain = ["torch>=2.0", "transformers>=4.40", "bitsandbytes>=0.43"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "black>=24.0", "ruff>=0.5.0", "numpy>=1.26", "pandas>=2.0", "pyarrow>=14", "faiss-cpu>=1.8", "pyphi>=1.2"]
all = [
    "agent-client-protocol>=0.12,<1",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "nvidia-ml-py>=12",
    "torch>=2.0",
    "transformers>=4.40",
    "bitsandbytes>=0.43",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.5.0",
    "pyphi>=1.2",
]

[project.scripts]
omni-coworker = "omni_coworker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--continue-on-collection-errors"
asyncio_mode = "auto"