[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-agent-coworker"
version = "0.1.0"
description = "Omni-Gemma Lab-Agent Coworker — sovereign agentic coworker for Google Competitions (The Gemma 4 Developer Agent Paper Track & Competition)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabrício da Silva" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
    "psutil>=5.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
acp = ["agent-client-protocol>=0.12,<1"]
kernel = ["faiss-cpu>=1.8", "sentence-transformers>=3.0", "pandas>=2.0", "pyarrow>=14", "nvidia-ml-py>=12"]
brain = ["torch>=2.0", "transformers>=4.40", "bitsandbytes>=0.43"]
test = ["pytest>=8.0", "black>=24.0", "ruff>=0.5.0", "numpy>=1.26", "pandas>=2.0", "pyarrow>=14", "faiss-cpu>=1.8"]

[project.scripts]
omni-coworker = "omni_coworker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--continue-on-collection-errors"
asyncio_mode = "auto"