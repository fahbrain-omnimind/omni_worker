<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Co-worker Superapp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #050505 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }
        .header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 2em;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 0.3em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 0.9em;
            color: #6a6a6a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff5f57;
            margin-left: 0.5em;
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .main {
            width: 100%;
            max-width: 900px;
            display: grid;
            gap: 1.5em;
        }
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 1.5em;
        }
        .card-title {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6a6a6a;
            margin-bottom: 1em;
            padding-bottom: 0.5em;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8em;
        }
        .metric {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 6px;
            padding: 0.8em;
            min-height: 40px;
        }
        .metric-label {
            font-size: 0.65em;
            color: #6a6a6a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3em;
            display: block;
        }
        .metric-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }
        .metric-value.error { color: #ff5f57; }
        .metric-value.good { color: #66f2a8; }
        .chat-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 1.5em;
            margin-top: 1em;
        }
        .chat-header {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6a6a6a;
            margin-bottom: 0.8em;
        }
        .chat-messages {
            height: 120px;
            overflow-y: auto;
            margin-bottom: 0.8em;
            font-size: 0.85em;
            color: #c0c0c0;
            line-height: 1.4;
        }
        .chat-input {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5em;
            margin-top: 0.5em;
        }
        .chat-input input {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 0.5em 0.8em;
            color: #e0e0e0;
            font-size: 0.85em;
            width: 100%;
        }
        .chat-input button {
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0 1.2em;
            font-size: 0.85em;
            cursor: pointer;
            min-width: 80px;
        }
        .chat-input button:hover { background: #764ba2; }
        .lang-toggle {
            margin-top: 1em;
            display: flex;
            gap: 0.5em;
            justify-content: center;
        }
        .lang-toggle button {
            background: rgba(255,255,255,0.05);
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.4em 0.8em;
            border-radius: 4px;
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
        .lang-toggle button.active { background: #667eea; color: #fff; }
        .section {
            min-height: 120px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 data-i18n="app.title">omni-agent-coworker</h1>
        <p class="subtitle" data-i18n="app.version">Supervisor Operacional</p>
        <div class="status-indicator" id="statusIndicator"></div>
    </div>

    <div class="main">
        <!-- Soma Probe Card -->
        <div class="card" id="somaCard">
            <div class="card-title" data-i18n="soma.probe">Soma Probe</div>
            <div class="metrics-grid" id="somaMetrics">
                <div class="metric"><span class="metric-label" data-i18n="cpu">CPU</span><span class="metric-value" id="cpuVal">0%</span></div>
                <div class="metric"><span class="metric-label" data-i18n="ram">RAM</span><span class="metric-value" id="ramVal">0/0 GB</span></div>
                <div class="metric"><span class="metric-label" data-i18n="gpu">GPU</span><span class="metric-value" id="gpuVal">—</span></div>
                <div class="metric"><span class="metric-label" data-i18n="vram">VRAM</span><span class="metric-value" id="vramVal">—</span></div>
                <div class="metric"><span class="metric-label" data-i18n="virt">Virt</span><span class="metric-value" id="virtVal">metal</span></div>
            </div>
        </div>

        <!-- Soul State Card -->
        <div class="card" id="soulCard">
            <div class="card-title" data-i18n="soul.state">Soul State</div>
            <div class="metrics-grid" id="soulMetrics">
                <div class="metric"><span class="metric-label" data-i18n="phi">Phi</span><span class="metric-value" id="phiVal">0.000</span></div>
                <div class="metric"><span class="metric-label" data-i18n="psi">Psi</span><span class="metric-value" id="psiVal">0.000</span></div>
                <div class="metric"><span class="metric-label" data-i18n="sigma">Sigma</span><span class="metric-value" id="sigmaVal">0.000</span></div>
                <div class="metric"><span class="metric-label" data-i18n="epsilon">Epsilon</span><span class="metric-value" id="epsilonVal">0.000</span></div>
                <div class="metric"><span class="metric-label" data-i18n="active_face">Active Face</span><span class="metric-value" id="activeFaceVal">—</span></div>
            </div>
        </div>

        <!-- Kernel Status Card -->
        <div class="card" id="kernelCard">
            <div class="card-title" data-i18n="kernel.status">Kernel Status</div>
            <div class="metrics-grid" id="kernelMetrics">
                <div class="metric"><span class="metric-label">Modules</span><span class="metric-value" id="kernelVal">—</span></div>
            </div>
        </div>

        <!-- Brain Topology Card -->
        <div class="card" id="brainCard">
            <div class="card-title" data-i18n="brain.topology">Brain Topology</div>
            <div class="metrics-grid" id="brainMetrics">
                <div class="metric"><span class="metric-label">Analyst</span><span class="metric-value" id="analystVal">—</span></div>
                <div class="metric"><span class="metric-label">Executor</span><span class="metric-value" id="executorVal">—</span></div>
            </div>
        </div>

        <!-- Safety Check Card -->
        <div class="card" id="safetyCard">
            <div class="card-title" data-i18n="safety.check">Safety Check</div>
            <div class="metrics-grid" id="safetyMetrics">
                <div class="metric"><span class="metric-label">Gate</span><span class="metric-value" id="gateVal">—</span></div>
                <div class="metric"><span class="metric-label">Matrix</span><span class="metric-value" id="matrixVal">—</span></div>
            </div>
        </div>
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chatBox">
        <div class="chat-header" data-i18n="brain.chat">Chat (Analyst)</div>
        <div class="chat-messages" id="chatMessages">
            <span class="muted" data-i18n="chat.prompt">Send a message to the analyst...</span>
        </div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Type message...">
            <button onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <div class="lang-toggle">
        <button onclick="setLang('pt-BR')">PT</button>
        <button onclick="setLang('en')">EN</button>
    </div>

    <script>
        let currentLang = 'pt-BR';

        const i18nEn = {
            "app.title": "omni-agent-coworker",
            "app.version": "Supervisory Dashboard",
            "soma.probe": "Soma Probe",
            "cpu": "CPU",
            "ram": "RAM",
            "gpu": "GPU",
            "vram": "VRAM",
            "virt": "Virt",
            "soul.state": "Soul State",
            "phi": "Phi",
            "psi": "Psi",
            "sigma": "Sigma",
            "epsilon": "Epsilon",
            "active_face": "Active Face",
            "kernel.status": "Kernel Status",
            "brain.topology": "Brain Topology",
            "safety.check": "Safety Check",
            "gate": "Gate",
            "matrix": "Matrix",
            "brain.chat": "Chat (Analyst)",
            "chat.prompt": "Send a message to the analyst...",
            "chat.send": "Send",
        };

        const i18nPtBr = {
            "app.title": "omni-agent-coworker",
            "app.version": "Painel Operacional",
            "soma.probe": "Sonda Somática",
            "cpu": "CPU",
            "ram": "RAM",
            "gpu": "GPU",
            "vram": "VRAM",
            "virt": "Virt",
            "soul.state": "Estado da Alma",
            "phi": "Phi",
            "psi": "Psi",
            "sigma": "Sigma",
            "epsilon": "Epsilon",
            "active_face": "Face Ativa",
            "kernel.status": "Status do Kernel",
            "brain.topology": "Topologia Cerebral",
            "safety.check": "Verificação de Segurança",
            "gate": "Gate",
            "matrix": "Matriz",
            "brain.chat": "Chat (Analista)",
            "chat.prompt": "Enviar mensagem para o analista...",
            "chat.send": "Enviar",
        };

        const translations = {
            'pt-BR': i18nPtBr,
            'en': i18nEn,
        };

        function i18n(key) {
            return (translations[currentLang][key] || key).toString();
        }

        function translateDOM() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = i18n(key);
            });
        }

        function setLang(lang) {
            currentLang = lang;
            translateDOM();
            document.documentElement.lang = lang;
        }

        // Initialize language
        setLang('pt-BR');

        async function fetchSomaProbe() {
            try {
                const resp = await fetch('/soma/probe');
                const data = await resp.json();
                const p = data;
                document.getElementById('cpuVal').textContent = (p.cpu_percent || 0) + '%';
                document.getElementById('ramVal').textContent = 
                    ((p.ram_used_gb || 0).toFixed(1) + '/' + (p.ram_total_gb || 0).toFixed(1) + ' GB');
                const gpus = (p.gpu || {}).gpus || [];
                if (gpus.length > 0) {
                    const g = gpus[0];
                    document.getElementById('gpuVal').textContent = 
                        (g.name || 'GPU') + ' ' + (g.util_percent || 0) + '%';
                    document.getElementById('vramVal').textContent = 
                        (g.vram_used_gb || 0).toFixed(1) + '/' + (g.vram_total_gb || 0).toFixed(1) + ' GB';
                } else {
                    document.getElementById('gpuVal').textContent = '—';
                    document.getElementById('vramVal').textContent = '—';
                }
                const v = p.virt || {};
                const tags = [v.container ? 'container' : '', v.vm || ''].filter(t => t).join('/') || 'metal';
                document.getElementById('virtVal').textContent = tags;
                updateStatus(data);
            } catch (e) {
                console.error('Failed to fetch soma probe:', e);
                showError('somaMetrics', true);
            }
        }

        async function fetchSoulState() {
            try {
                const resp = await fetch('/soul/state');
                const data = await resp.json();
                document.getElementById('phiVal').textContent = (data.phi || 0).toFixed(3);
                document.getElementById('psiVal').textContent = (data.psi || 0).toFixed(3);
                document.getElementById('sigmaVal').textContent = (data.sigma || 0).toFixed(3);
                document.getElementById('epsilonVal').textContent = (data.epsilon || 0).toFixed(3);
                const activeFace = data.dodeca?.active_face || '—';
                document.getElementById('activeFaceVal').textContent = activeFace;
                updateStatus(data);
            } catch (e) {
                console.error('Failed to fetch soul state:', e);
                showError('soulMetrics', true);
            }
        }

        async function fetchKernelStatus() {
            try {
                const resp = await fetch('/kernel/status');
                const data = await resp.json();
                const modules = data.modules || {};
                const names = Object.keys(modules).filter(k => modules[k]).join(', ') || '—';
                document.getElementById('kernelVal').textContent = names;
                showError('kernelMetrics', false);
            } catch (e) {
                console.error('Failed to fetch kernel status:', e);
                showError('kernelMetrics', true);
            }
        }

        async function fetchBrainTopology() {
            try {
                const resp = await fetch('/brain/topology');
                const data = await resp.json();
                document.getElementById('analystVal').textContent = data.analyst?.status || '—';
                document.getElementById('executorVal').textContent = data.executor?.status || '—';
                showError('brainMetrics', false);
            } catch (e) {
                console.error('Failed to fetch brain topology:', e);
                showError('brainMetrics', true);
            }
        }

        async function fetchSafetyCheck() {
            try {
                const resp = await fetch('/safety/check');
                const data = await resp.json();
                document.getElementById('gateVal').textContent = data.gate !== undefined ? (data.gate ? 'active' : 'inactive') : '—';
                document.getElementById('matrixVal').textContent = data.matrix !== undefined ? String(data.matrix) : '—';
                showError('safetyMetrics', false);
            } catch (e) {
                console.error('Failed to fetch safety check:', e);
                showError('safetyMetrics', true);
            }
        }

        function showError(cardId, isError) {
            const card = document.getElementById(cardId);
            if (isError) {
                card.style.borderColor = '#ff5f57';
            } else {
                card.style.borderColor = 'rgba(255,255,255,0.08)';
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';

            const messagesDiv = document.getElementById('chatMessages');
            const newMsg = document.createElement('div');
            newMsg.textContent = 'You: ' + msg;
            newMsg.style.color = '#a8e6cf';
            messagesDiv.appendChild(newMsg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const resp = await fetch('/brain/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: 'analyst', message: msg })
                });
                const data = await resp.json();
                const respDiv = document.createElement('div');
                respDiv.textContent = 'Analyst: ' + (data.response || JSON.stringify(data));
                respDiv.style.color = '#ffd93d';
                messagesDiv.appendChild(respDiv);
            } catch (e) {
                console.error('Chat failed:', e);
                const errDiv = document.createElement('div');
                errDiv.textContent = 'Analist: Error';
                errDiv.style.color = '#ff5f57';
                messagesDiv.appendChild(errDiv);
            }
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Poll every 5 seconds
        fetchSomaProbe();
        fetchSoulState();
        fetchKernelStatus();
        fetchBrainTopology();
        fetchSafetyCheck();
        setInterval(() => { fetchSomaProbe(); fetchSoulState(); fetchKernelStatus(); fetchBrainTopology(); fetchSafetyCheck(); }, 5000);
    </script>
</body>
</html>
