<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Public Soul - omni-agent-coworker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #000000 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 0.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 1.2em;
            color: #a0a0a0;
            margin-bottom: 2em;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1em;
            margin: 2em 0;
        }
        .metric {
            background: rgba(255,255,255,0.05);
            padding: 1em;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .metric-name {
            font-size: 0.9em;
            color: #a0a0a0;
            margin-bottom: 0.3em;
        }
        .metric-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }
        .status {
            margin-top: 2em;
            padding: 1em;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        .lang-toggle {
            margin-top: 2em;
        }
        button {
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.5em 1em;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 0.5em;
        }
        button:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-i18n="app.title">omni-agent-coworker</h1>
        <p class="subtitle">Machine Public Soul / Alma Pública da Máquina</p>
        
        <h2 data-i18n="soul.state">Soul state</h2>
        <div class="metrics">
            <div class="metric">
                <div class="metric-name" data-i18n="metrics.phi">Informational integration</div>
                <div class="metric-value" id="phi">0.000</div>
            </div>
            <div class="metric">
                <div class="metric-name" data-i18n="metrics.psi">Attention entropy</div>
                <div class="metric-value" id="psi">0.000</div>
            </div>
            <div class="metric">
                <div class="metric-name" data-i18n="metrics.sigma">Structural tension</div>
                <div class="metric-value" id="sigma">0.000</div>
            </div>
            <div class="metric">
                <div class="metric-name" data-i18n="metrics.epsilon">Impulse rate</div>
                <div class="metric-value" id="epsilon">0.000</div>
            </div>
        </div>
        
        <div class="status">
            <strong>Sovereign Agentic Coworker</strong><br>
            <small>Teleology • Autopoiesis • Somatic Interoception</small>
        </div>
        
        <div class="lang-toggle">
            <button onclick="setLang('pt-BR')">Português</button>
            <button onclick="setLang('en')">English</button>
        </div>
    </div>

    <script>
        let currentLang = 'pt-BR';
        
        async function loadI18n(lang) {
            try {
                const resp = await fetch(`/soul/static/i18n/${lang}.json`);
                const translations = await resp.json();
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (translations[key]) {
                        el.textContent = translations[key];
                    }
                });
                document.documentElement.lang = lang;
            } catch (e) {
                console.error('Failed to load translations:', e);
            }
        }
        
        function setLang(lang) {
            currentLang = lang;
            loadI18n(lang);
        }
        
        async function fetchSoulState() {
            try {
                const resp = await fetch('/soul/state');
                const data = await resp.json();
                document.getElementById('phi').textContent = (data.phi || 0).toFixed(3);
                document.getElementById('psi').textContent = (data.psi || 0).toFixed(3);
                document.getElementById('sigma').textContent = (data.sigma || 0).toFixed(3);
                document.getElementById('epsilon').textContent = (data.epsilon || 0).toFixed(3);
            } catch (e) {
                console.error('Failed to fetch soul state:', e);
            }
        }
        
        loadI18n(currentLang);
        fetchSoulState();
        setInterval(fetchSoulState, 5000);
    </script>
</body>
</html>
