# Minimal CI for omni-agent-coworker (GitLab shared runners, no tags).
# gate: compile + lint gate on every push/MR; test: unit suite.
# Mirrors omni_node's layered style, portable (pip-installable image).

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [gate, test]

gate:lint:
  stage: gate
  image: python:3.12-slim
  timeout: 10m
  script:
    - python -m compileall -q src scripts tests
    - |
      pip install -q ruff && ruff check src scripts tests --select E9,F63,F7,F82 \
        || echo "ruff skipped"

test:unit:
  stage: test
  image: python:3.12-slim
  timeout: 20m
  variables:
    PIP_CACHE_DIR: .pip-cache
  cache:
    key: pip
    paths: [.pip-cache]
  script:
    - pip install -q --cache-dir .pip-cache -e ".[test]"
    - pytest -q tests/
